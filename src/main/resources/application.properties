spring.application.name=GreenBottle
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/greenbottledb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
greenbottle.security.encryption-key=${GREENBOTTLE_SECURITY_ENCRYPTION_KEY:}
#Only for testing
spring.datasource.username=root
spring.datasource.password=root
server.error.path=/error
server.error.whitelabel.enabled=false
# Behind the Cloudflare tunnel: honor X-Forwarded-* so redirects use https.
server.forward-headers-strategy=framework