# Configurazione dei test: database dedicato, separato da greenbottledb (quella usata dall'app e
# riempita dal popolatore). Lo schema viene creato e distrutto a ogni esecuzione, così i test non
# dipendono dai dati presenti in locale.
spring.datasource.url=jdbc:mysql://localhost:3306/greenbottledbtest?createDatabaseIfNotExist=true
spring.jpa.hibernate.ddl-auto=create-drop
